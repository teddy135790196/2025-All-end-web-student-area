name: Temporary Whisper Build

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential git curl
      - name: Build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build --config Release -j2
      - name: Download multilingual tiny model
        run: |
          mkdir -p bundle
          curl -L --fail --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o bundle/ggml-tiny.bin
          cp whisper.cpp/build/bin/whisper-cli bundle/
          cp whisper.cpp/build/bin/whisper-server bundle/ 2>/dev/null || true
          tar -czf whisper-linux-tiny.tar.gz -C bundle .
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-tiny
          path: whisper-linux-tiny.tar.gz
          retention-days: 1
